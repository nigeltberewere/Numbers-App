name: Build iOS for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. CLEANUP (Prevent old cache issues)
      - name: Clean Build
        run: |
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          flutter clean

      # 2. INJECT KEYS
      - name: Create .env file
        run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env

      - name: Install dependencies
        run: flutter pub get

      # 3. THE RUBY FIX (This opens the project file and logically disables signing)
      - name: Disable Signing with Ruby
        run: |
          cat <<EOF > fix_signing.rb
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          # 1. Disable "Automatically Manage Signing"
          project.root_object.attributes['TargetAttributes']&.each do |target_uuid, attributes|
            attributes['ProvisioningStyle'] = 'Manual'
            attributes.delete('DevelopmentTeam')
          end

          # 2. Force Build Settings to "No Signing" for all configurations
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              config.build_settings.delete('DEVELOPMENT_TEAM')
            end
          end
          project.save
          EOF
          
          # Run the script we just created
          ruby fix_signing.rb

      # 4. BUILD
      - name: Build iOS (Unsigned)
        run: |
          flutter build ios --release --no-codesign
          
          # Package the app
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -qq -r -9 release.ipa Payload

      # 5. UPLOAD
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release
          path: release.ipa
