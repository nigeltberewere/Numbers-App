name: Build iOS for Sideloading

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [ main ] # Trigger on push to main

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. CLEANUP (Fixes "Podfile" errors)
      - name: Clean Build Files
        run: |
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ios/.symlinks
          flutter clean

      # 2. INJECT KEYS (Keeps your API keys working)
      - name: Create .env file
        run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env

      - name: Install dependencies
        run: flutter pub get

      # 3. THE FIX: FORCE DISABLE SIGNING (Hacks the project file)
      - name: Disable Signing in Xcode Project
        run: |
          # Disable signing in the project file
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          # Remove any existing Team ID
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj

      # 4. BUILD (Unsigned)
      - name: Build iOS (Unsigned)
        run: |
          flutter build ios --release --no-codesign
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -qq -r -9 release.ipa Payload

      # 5. UPLOAD (Download this file later)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release
          path: release.ipa
