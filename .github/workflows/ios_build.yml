name: Build iOS for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. CLEANUP (Critical for a fresh start)
      - name: Clean Build
        run: |
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          flutter clean

      # 2. INJECT KEYS - create .env for OPENAI (existing)
      - name: Create .env file
        run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env

      # 2b. INJECT KEYS - create lib/utils/constants.dart from GEMINI secret (CI only)
      - name: Create lib/utils/constants.dart from GEMINI secret
        # Expose the secret to the runner only for this step
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          key = os.environ.get('GEMINI_API_KEY', '')
          pathlib.Path('lib/utils').mkdir(parents=True, exist_ok=True)
          with open('lib/utils/constants.dart', 'w') as f:
              f.write('// Auto-generated in CI. DO NOT COMMIT.\n')
              f.write('class AppConstants {\n')
              f.write('  static const String geminiApiKey = %s;\n' % json.dumps(key))
              f.write('}\n')
          print('WROTE lib/utils/constants.dart (CI-only)')
          PY

      - name: Install dependencies
        run: flutter pub get

      # 3. THE FIX: Build using xcodebuild directly
      # We pass CODE_SIGNING_ALLOWED=NO directly to the command.
      # This overrides whatever is in the project file.
      - name: Build iOS (Direct Xcodebuild)
        run: |
          cd ios
          # Update Pods first
          pod install --repo-update
          
          # Build using raw xcodebuild command
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            -destination 'generic/platform=iOS' \
            build

      # 4. PACKAGE (Find the app and zip it)
      - name: Package IPA
        run: |
          # Go to where xcodebuild puts the app
          cd ios/build/Release-iphoneos
          mkdir Payload
          mv Runner.app Payload
          zip -qq -r -9 release.ipa Payload
          # Move it up to the main folder so the upload step can find it
          mv release.ipa ../../../release.ipa

      # 5. UPLOAD
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release
          path: release.ipa
