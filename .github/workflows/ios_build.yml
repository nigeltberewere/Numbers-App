name: Build iOS for Sideloading

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [ main ] # Trigger on push to main

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. CLEANUP (Fixes "Podfile" and cache errors)
      - name: Clean Build Files
        run: |
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ios/.symlinks
          flutter clean

      # 2. INJECT KEYS (Keeps your API keys working)
      - name: Create .env file
        run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env

      - name: Install dependencies
        run: flutter pub get

      # 3. THE NUCLEAR FIX: Force disable signing using regex
      - name: Force Disable Signing
        run: |
          cd ios/Runner.xcodeproj
          # Turn off "Automatically Manage Signing"
          sed -i '' 's/CODE_SIGN_STYLE = .*/CODE_SIGN_STYLE = Manual;/g' project.pbxproj
          # Force signing to be optional
          sed -i '' 's/CODE_SIGNING_REQUIRED = .*/CODE_SIGNING_REQUIRED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = .*/CODE_SIGNING_ALLOWED = NO;/g' project.pbxproj
          # Remove the Development Team ID completely
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' project.pbxproj
          # Clear any specific provisioning profile requirements
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = "";/g' project.pbxproj
          cd ../..

      # 4. BUILD (Unsigned)
      - name: Build iOS (Unsigned)
        run: |
          # We use --no-codesign, but the sed commands above make sure Flutter actually believes us
          flutter build ios --release --no-codesign
          
          # Package the app
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -qq -r -9 release.ipa Payload

      # 5. UPLOAD (Download this file later)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release
          path: release.ipa
